services:
  - type: web
    name: ai-diff-review-service
    env: image
    image:
      url: docker.io/adityaraut2606/ai-diff-review:latest
    envVars:
      - key: BEARER_TOKEN
        value: xsolla-secret-bearer-token-2026
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
